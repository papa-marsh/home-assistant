default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

frontend:
  themes: !include_dir_merge_named themes

homeassistant:
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 192.168.0.0/24
      allow_bypass_login: true
    - type: homeassistant

lovelace:
  mode: storage
  dashboards:
    lovelace-cast:
      mode: yaml
      title: Cast
      icon: mdi:cast
      show_in_sidebar: true
      filename: ui-cast.yaml
    lovelace-mobile:
      mode: yaml
      title: Mobile
      icon: mdi:cellphone
      show_in_sidebar: true
      filename: ui-mobile.yaml

sensor:
  - platform: time_date
    display_options:
      - "time"
      - "date"
      - "date_time_iso"
